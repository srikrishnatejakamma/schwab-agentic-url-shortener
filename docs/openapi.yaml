openapi: 3.0.3
info:
  title: Agentic URL Shortener API
  version: 1.0.0
  description: API contract for the Schwab assignment prototype.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service health and repository statistics.
  /api/urls:
    get:
      summary: List shortened URLs
      responses:
        '200':
          description: Array of URL records.
    post:
      summary: Create a short URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUrlRequest'
      responses:
        '201':
          description: Short URL created.
        '200':
          description: Short URL already existed for the supplied idempotency key.
  /api/urls/{code}:
    get:
      summary: Fetch a short URL record
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        '200':
          description: URL record details.
  /api/urls/{code}/analytics:
    get:
      summary: Get analytics for a short URL
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Analytics snapshot.
  /r/{code}:
    get:
      summary: Redirect to the target URL
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the original target URL.
  /api/workflows:
    get:
      summary: List workflow scenarios
      responses:
        '200':
          description: Workflow catalog.
  /api/workflows/{scenario}:
    post:
      summary: Execute a workflow scenario
      parameters:
        - in: path
          name: scenario
          required: true
          schema:
            type: string
            enum: [greenfield, brownfield, ambiguous]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowTrigger'
      responses:
        '200':
          description: Workflow execution result.
components:
  schemas:
    CreateUrlRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        customCode:
          type: string
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 3650
        tags:
          type: array
          items:
            type: string
        idempotencyKey:
          type: string
    WorkflowTrigger:
      type: object
      properties:
        approvals:
          type: object
          additionalProperties:
            type: object
            properties:
              approved:
                type: boolean
              approver:
                type: string
              reason:
                type: string
        input:
          type: object
          additionalProperties: true
