<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Review URLs Flow</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main>
      <nav class="top-nav" aria-label="Primary">
        <a href="/">Home</a>
        <a href="/create">Create URL</a>
        <a href="/links" class="active">Review URLs</a>
        <a href="/workflows">Run Workflows</a>
      </nav>

      <section class="hero">
        <p class="eyebrow">Flow 2</p>
        <h1>Review Created URLs</h1>
        <p>Refresh and inspect URL records and service health in one place.</p>
      </section>

      <section class="grid">
        <article class="panel">
          <h2>URL table</h2>
          <div class="actions">
            <button type="button" id="refresh-links-button">Refresh links</button>
            <button type="button" class="secondary" id="health-check-button">Check health</button>
          </div>
          <pre id="health-result" class="result">Loading health...</pre>
          <div class="table-wrap">
            <table aria-label="Created URLs">
              <thead>
                <tr>
                  <th>Code</th>
                  <th>Short URL</th>
                  <th>Target URL</th>
                  <th>Clicks</th>
                  <th>Created</th>
                </tr>
              </thead>
              <tbody id="links-table-body">
                <tr>
                  <td colspan="5" class="muted">Loading links...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </article>
      </section>
    </main>

    <script src="/assets/app-ui.js" defer></script>
  </body>
</html>
